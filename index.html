<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reliance Job & OT - RDL OT</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#16a34a">
</head>
<body>

  <!-- অ্যাপের মূল হেডার -->
  <header style="background: #16a34a; color: white; padding: 12px; text-align: center;">
    <h2>Reliance Job & OT</h2>
    <p style="margin: 0; font-size: 14px;">RELIANCE DRESSES LIMITED</p>
  </header>

  <!-- প্রধান কন্টেন্ট পেজ -->
  <div class="container" style="padding: 15px;">
    
    <!-- ইউজার আইডি ও নাম সেকশন -->
    <div style="background: #f8fafc; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #e2e8f0;">
      <label style="font-size: 13px; font-weight: bold;">নাম:</label>
      <input type="text" id="user-name" placeholder="আপনার নাম লিখুন" style="width: 100%; padding: 8px; margin-top: 4px; margin-bottom: 8px; border: 1px solid #cbd5e1; border-radius: 4px;">
      
      <label style="font-size: 13px; font-weight: bold;">আইডি নম্বর:</label>
      <input type="text" id="user-id" placeholder="আপনার আইডি লিখুন" style="width: 100%; padding: 8px; margin-top: 4px; margin-bottom: 8px; border: 1px solid #cbd5e1; border-radius: 4px;">
      
      <button onclick="saveUserInfo()" style="background: #16a34a; color: white; border: none; padding: 8px 15px; border-radius: 4px; width: 100%; font-weight: bold; cursor: pointer;">সংরক্ষণ করুন</button>
    </div>

    <!-- বর্তমান তারিখ ও আজকের সারাংশ -->
    <div style="text-align: center; margin-bottom: 15px;">
      <span id="current-date-str" style="font-size: 14px; font-weight: bold; color: #334155;"></span>
    </div>

    <!-- হোম পেজ লিস্ট এবং অন্যান্য ট্যাব কন্টেন্ট -->
    <div id="tab-home" class="tab-page">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h3 style="margin: 0; font-size: 16px;">চলতি মাসের হিসাব</h3>
        <button onclick="openAddModal()" style="background: #16a34a; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer;">+ হিসাব যোগ করুন</button>
      </div>

      <!-- ওটি হিস্ট্রি টেবিল লিস্ট -->
      <div id="ot-history-list"></div>
    </div>

    <!-- সোশ্যাল ও ডাউনলোড বাটন সেকশন -->
    <div style="margin-top: 30px; text-align: center;">
      <!-- নতুন যুক্ত করা এক ক্লিকে অ্যাপ ইনস্টল বাটন -->
      <div style="margin-bottom: 15px;">
        <button onclick="installApp()" style="background: #16a34a; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); width: 100%;">
          📥 এক ক্লিকে অ্যাপ ডাউনলোড ও ইনস্টল করুন
        </button>
      </div>

      <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 10px;">
        <button onclick="window.open('https://facebook.com', '_blank')" style="background: #2563eb; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1;">Facebook Profile</button>
        <button onclick="window.open('https://tiktok.com', '_blank')" style="background: #0f172a; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1;">TikTok Profile</button>
      </div>
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button onclick="openWhatsApp()" style="background: #22c55e; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1;">হোয়াটসঅ্যাপ সাপোর্ট</button>
        <button onclick="makeCall()" style="background: #3b82f6; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1;">কল হেল্পলাইন</button>
      </div>
    </div>

  </div>

  <!-- পপ-আপ মডাল (হিসাব যোগ করার জন্য) -->
  <div id="addModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
    <div style="background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px;">
      <h3>দৈনিক হিসাব যোগ করুন</h3>
      <label>তারিখ:</label>
      <input type="date" id="form-date" style="width: 100%; padding: 6px; margin-bottom: 8px;">
      
      <label>ডিউটি ঘণ্টা:</label>
      <input type="number" id="form-duty" value="8" style="width: 100%; padding: 6px; margin-bottom: 8px;">
      
      <label>ওটি (OT) ঘণ্টা:</label>
      <input type="number" id="form-ot" value="0" style="width: 100%; padding: 6px; margin-bottom: 8px;">
      
      <label>ওটি রেট:</label>
      <input type="number" id="form-rate" value="53" style="width: 100%; padding: 6px; margin-bottom: 8px;">
      
      <label>অন্যান্য পাওনা:</label>
      <input type="number" id="form-other" value="0" style="width: 100%; padding: 6px; margin-bottom: 8px;">
      
      <label>নোট:</label>
      <input type="text" id="form-note" placeholder="কিছু লিখতে চাইলে..." style="width: 100%; padding: 6px; margin-bottom: 12px;">

      <div style="display: flex; gap: 10px;">
        <button onclick="saveDailyRecord()" style="background: #16a34a; color: white; border: none; padding: 8px; flex: 1; border-radius: 4px; font-weight: bold; cursor: pointer;">সেভ করুন</button>
        <button onclick="closeAddModal()" style="background: #ef4444; color: white; border: none; padding: 8px; flex: 1; border-radius: 4px; font-weight: bold; cursor: pointer;">বাতিল</button>
      </div>
    </div>
  </div>

  <!-- স্ক্রিপ্ট ফাইল লিংক -->
  <script src="app.js"></script>
  <script>
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('User accepted the install prompt');
          }
          deferredPrompt = null;
        });
      } else {
        alert('আপনার ব্রাউজারের মেনু (...) এ গিয়ে "Add to Home Screen" বা "Install App" সিলেক্ট করে ইনস্টল করে নিন।');
      }
    }
  </script>
</body>
</html>
