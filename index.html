<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reliance Job & OT</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- লাইভ কাউন্টার সেকশন -->
  <div class="stats-bar">
    <div class="stat-item">🟢 অনলাইন ইউজার: <span id="live-online">0</span></div>
    <div class="stat-item">👁️ মোট ভিজিটর: <span id="total-visitors">0</span></div>
  </div>

  <header>
    <h1>Reliance Job & OT</h1>
  </header>

  <!-- ইউজার প্রোফাইল / অটো-লগইন কার্ড -->
  <div class="card" id="user-card">
    <h3>👤 ব্যবহারকারীর তথ্য</h3>
    <div id="login-form">
      <input type="text" id="user-name" placeholder="আপনার নাম লিখুন">
      <input type="text" id="user-id" placeholder="আপনার আইডি লিখুন">
      <button onclick="saveUserInfo()">সংরক্ষণ করুন</button>
    </div>
    <div id="user-display" style="display:none;">
      <p><strong>নাম:</strong> <span id="disp-name"></span></p>
      <p><strong>আইডি:</strong> <span id="disp-id"></span></p>
    </div>
  </div>

  <!-- নোটিশ বোর্ড সেকশন -->
  <div class="card" id="notice-board">
    <h3>📢 নোটিশ বোর্ড ও আপডেট</h3>
    <p id="notice-text">কোনো নতুন নোটিশ নেই।</p>
  </div>

  <!-- গার্মেন্টস তথ্য ও ক্যারিয়ার গাইড -->
  <div class="card">
    <h3>🧵 গার্মেন্টস তথ্য ও ক্যারিয়ার গাইড</h3>
    <p>গার্মেন্টস সেক্টরের অজানা তথ্য, সেকশন গাইড ও স্কিপ টিপস জানতে নিচে ক্লিক করুন।</p>
    <button onclick="alert('গাইড সেকশন শীঘ্রই আপডেট করা হচ্ছে!')">গাইড দেখুন</button>
  </div>

  <!-- লোক লাগবে / ভুল সংশোধনের ফিডব্যাক -->
  <div class="card">
    <h3>💬 সাহায্য ও ফিডব্যাক</h3>
    <textarea id="feedback-text" placeholder="ভুল সংশোধন বা লোক লাগলে এখানে লিখুন..."></textarea>
    <button onclick="sendFeedback()">পাঠান</button>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="app.js"></script>
</body>
</html>
